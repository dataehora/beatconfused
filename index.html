                 use — each labelled with a different chromatic neighbour
                 (A, A♯, B) so the icon reads as "every note", distinct from
                 the Octave Strobe Tuner card's single dome-shaped wheel.
                 Built entirely by buildFanTrio() below. -->

  <script>
    // Builds the homepage tool icons as small, static replicas of the
    // real devices, frozen in the green "in tune" state for A4 440Hz at
    // 0 cents — rather than unrelated decorative graphics. The two
    // strobe-family tools (Octave Strobe Tuner, Chromatic Strobe Tuner)
    // share the strobe-wheel icon; the Tuner card gets a needle gauge,
    // matching its default display.
    function buildStrobeIcon(wedgesGroupId) {
      const NS = "http://www.w3.org/2000/svg";
      const wedgesGroup = document.getElementById(wedgesGroupId);

      if (!wedgesGroup) {
        return;
      }

      const cx = 150;
      const cy = 150;
      const rings = [
        { inner: 100, outer: 120, count: 16 },
        { inner: 72, outer: 92, count: 8 },
        { inner: 44, outer: 64, count: 4 },
      ];

      function polar(r, deg) {
        const rad = (deg * Math.PI) / 180;
        return { x: cx + r * Math.sin(rad), y: cy - r * Math.cos(rad) };
      }

      function wedgePath(innerR, outerR, startDeg, endDeg) {
        const startOuter = polar(outerR, startDeg);
        const endOuter = polar(outerR, endDeg);
        const startInner = polar(innerR, startDeg);
        const endInner = polar(innerR, endDeg);
        const largeArc = endDeg - startDeg > 180 ? 1 : 0;

        return (
          `M ${startInner.x.toFixed(2)} ${startInner.y.toFixed(2)} ` +
          `L ${startOuter.x.toFixed(2)} ${startOuter.y.toFixed(2)} ` +
          `A ${outerR} ${outerR} 0 ${largeArc} 1 ${endOuter.x.toFixed(2)} ${endOuter.y.toFixed(2)} ` +
          `L ${endInner.x.toFixed(2)} ${endInner.y.toFixed(2)} ` +
          `A ${innerR} ${innerR} 0 ${largeArc} 0 ${startInner.x.toFixed(2)} ${startInner.y.toFixed(2)} Z`
        );
      }

      rings.forEach((ring, ringIndex) => {
        const g = document.createElementNS(NS, "g");
        g.setAttribute("class", ringIndex % 2 === 0 ? "tuner-icon-wedges" : "tuner-icon-wedges tuner-icon-wedges-alt");

        const totalSlices = ring.count * 2;
        const step = 360 / totalSlices;

        for (let i = 0; i < totalSlices; i += 2) {
          const path = document.createElementNS(NS, "path");
          path.setAttribute("d", wedgePath(ring.inner, ring.outer, i * step, (i + 1) * step));
          g.appendChild(path);
        }

        wedgesGroup.appendChild(g);
      });
    }

    // The Tuner card's needle gauge: a fan of scale ticks and a short
    // meter needle (about half the dial radius). CSS swings the needle
    // around the centered "in tune" position, green at the middle and
    // easing to amber at the extremes — the same colour language the
    // real /tuner/ needle uses.
    function buildNeedleIcon() {
      const NS = "http://www.w3.org/2000/svg";
      const ticksGroup = document.getElementById("tunerIconTicks");
      const needleGroup = document.getElementById("tunerIconNeedle");

      if (!ticksGroup || !needleGroup) {
        return;
      }

      const cx = 150;
      const cy = 150;

      function polar(r, deg) {
        const rad = (deg * Math.PI) / 180;
        return { x: cx + r * Math.sin(rad), y: cy - r * Math.cos(rad) };
      }

      for (let deg = -45; deg <= 45; deg += 15) {
        const isMajor = deg === -45 || deg === 0 || deg === 45;
        const inner = polar(74, deg);
        const outer = polar(isMajor ? 94 : 88, deg);
        const tick = document.createElementNS(NS, "line");
        tick.setAttribute("x1", inner.x.toFixed(2));
        tick.setAttribute("y1", inner.y.toFixed(2));
        tick.setAttribute("x2", outer.x.toFixed(2));
        tick.setAttribute("y2", outer.y.toFixed(2));
        tick.setAttribute("class", isMajor ? "needle-icon-tick needle-icon-tick-major" : "needle-icon-tick");
        ticksGroup.appendChild(tick);
      }

      // A little longer/wider than a plain meter needle — this is the
      // card's hero glyph, so it reads clearly even at thumbnail size.
      const needle = document.createElementNS(NS, "path");
      needle.setAttribute("d", "M146.3 150 L153.7 150 L150.7 84 L150 76 L149.3 84 Z");
      needle.setAttribute("class", "needle-icon-pointer");
      needleGroup.appendChild(needle);
    }

    // The Chromatic Strobe Tuner card's logo: three overlapping strobe
    // "fans", each the same pointed-vertex wedge shape /strobetuner/'s real
    // discs use (see shared/strobe-disc.js's sectorPath) — one out front
    // labelled A, two behind labelled B♭ and B, so three chromatic
    // neighbours read as "every note" at a glance, distinct from the
    // Octave Strobe Tuner card's single dome-shaped wheel.
    function buildFanTrio() {
      const NS = "http://www.w3.org/2000/svg";
      const container = document.getElementById("fanTrio");

      if (!container) {
        return;
      }

      const cx = 110;
      const cy = 150;
      const caseR = 110;
      const windowR = 96;
      const halfSpan = 68; // 136° arc, matching /strobetuner/'s wide window
      const RINGS = [
        { inner: 72, outer: 90, count: 16 },
        { inner: 50, outer: 68, count: 8 },
        { inner: 28, outer: 46, count: 4 },
      ];
      const FANS = [
        { position: "left", label: "B♭" },
        { position: "right", label: "B" },
        { position: "top", label: "A" },
      ];

      function polar(r, deg) {
        const rad = (deg * Math.PI) / 180;
        return { x: cx + r * Math.sin(rad), y: cy - r * Math.cos(rad) };
      }

      // A pie wedge from the vertex (cx, cy) out to the arc — the same
      // shape shared/strobe-disc.js's sectorPath draws for the real discs.
      function sectorPath(r) {
        const start = polar(r, -halfSpan);
        const end = polar(r, halfSpan);
        return (
          `M ${cx} ${cy} ` +
          `L ${start.x.toFixed(2)} ${start.y.toFixed(2)} ` +
          `A ${r} ${r} 0 0 1 ${end.x.toFixed(2)} ${end.y.toFixed(2)} Z`
        );
      }

      function wedgePath(innerR, outerR, startDeg, endDeg) {
        const startOuter = polar(outerR, startDeg);
        const endOuter = polar(outerR, endDeg);
        const startInner = polar(innerR, startDeg);
        const endInner = polar(innerR, endDeg);

        return (
          `M ${startInner.x.toFixed(2)} ${startInner.y.toFixed(2)} ` +
          `L ${startOuter.x.toFixed(2)} ${startOuter.y.toFixed(2)} ` +
          `A ${outerR} ${outerR} 0 0 1 ${endOuter.x.toFixed(2)} ${endOuter.y.toFixed(2)} ` +
          `L ${endInner.x.toFixed(2)} ${endInner.y.toFixed(2)} ` +
          `A ${innerR} ${innerR} 0 0 0 ${startInner.x.toFixed(2)} ${startInner.y.toFixed(2)} Z`
        );
      }

      function addStop(gradient, offset, color) {
        const stop = document.createElementNS(NS, "stop");
        stop.setAttribute("offset", offset);
        stop.setAttribute("stop-color", color);
        gradient.appendChild(stop);
      }

      FANS.forEach((fan, fanIndex) => {
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("viewBox", "0 0 220 170");
        svg.setAttribute("class", `fan-icon fan-icon-${fan.position}`);
        svg.setAttribute("role", "presentation");
        svg.setAttribute("focusable", "false");

        const defs = document.createElementNS(NS, "defs");

        const caseGradient = document.createElementNS(NS, "linearGradient");
        const caseId = `fanCaseGradient${fanIndex}`;
        caseGradient.setAttribute("id", caseId);
        caseGradient.setAttribute("x1", "0.08");
        caseGradient.setAttribute("y1", "0.04");
        caseGradient.setAttribute("x2", "0.85");
        caseGradient.setAttribute("y2", "0.95");
        addStop(caseGradient, "0", "#caa06a");
        addStop(caseGradient, "1", "#8a5a30");
        defs.appendChild(caseGradient);

        const windowGradient = document.createElementNS(NS, "radialGradient");
        const windowId = `fanWindowGradient${fanIndex}`;
        windowGradient.setAttribute("id", windowId);
        windowGradient.setAttribute("cx", "0.5");
        windowGradient.setAttribute("cy", "0.4");
        windowGradient.setAttribute("r", "0.8");
        addStop(windowGradient, "0", "#362b21");
        addStop(windowGradient, "1", "#171310");
        defs.appendChild(windowGradient);

        const clipId = `fanClip${fanIndex}`;
        const clipPath = document.createElementNS(NS, "clipPath");
        clipPath.setAttribute("id", clipId);
        const clipShape = document.createElementNS(NS, "path");
        clipShape.setAttribute("d", sectorPath(windowR));
        clipPath.appendChild(clipShape);
        defs.appendChild(clipPath);

        svg.appendChild(defs);

        const caseShape = document.createElementNS(NS, "path");
        caseShape.setAttribute("class", "fan-case");
        caseShape.setAttribute("d", sectorPath(caseR));
        caseShape.setAttribute("fill", `url(#${caseId})`);
        svg.appendChild(caseShape);

        const windowShape = document.createElementNS(NS, "path");
        windowShape.setAttribute("class", "fan-window");
        windowShape.setAttribute("d", sectorPath(windowR));
        windowShape.setAttribute("fill", `url(#${windowId})`);
        svg.appendChild(windowShape);

        const wedgesGroup = document.createElementNS(NS, "g");
        wedgesGroup.setAttribute("clip-path", `url(#${clipId})`);

        RINGS.forEach((ring, ringIndex) => {
          const g = document.createElementNS(NS, "g");
          g.setAttribute("class", ringIndex % 2 === 0 ? "fan-wedges" : "fan-wedges fan-wedges-alt");
          const totalSlices = ring.count * 2;
          const step = 360 / totalSlices;

          for (let i = 0; i < totalSlices; i += 2) {
            const path = document.createElementNS(NS, "path");
            path.setAttribute("d", wedgePath(ring.inner, ring.outer, i * step, (i + 1) * step));
            g.appendChild(path);
          }

          wedgesGroup.appendChild(g);
        });

        svg.appendChild(wedgesGroup);

        // A sparse ring of bezel ticks between the window and the case rim,
        // plus flat/sharp glyphs at the arc's two ends — echoing
        // /strobetuner/'s real reference bezel at icon scale.
        const ticksGroup = document.createElementNS(NS, "g");
        ticksGroup.setAttribute("class", "fan-scale-ticks");

        for (let angle = -halfSpan; angle <= halfSpan + 0.01; angle += 34) {
          const inner = polar(windowR + 2, angle);
          const outer = polar(caseR - 3, angle);
          const tick = document.createElementNS(NS, "line");
          tick.setAttribute("x1", inner.x.toFixed(2));
          tick.setAttribute("y1", inner.y.toFixed(2));
          tick.setAttribute("x2", outer.x.toFixed(2));
          tick.setAttribute("y2", outer.y.toFixed(2));
          ticksGroup.appendChild(tick);
        }

        svg.appendChild(ticksGroup);

        const flatPoint = polar(windowR + 8, -halfSpan);
        const flatLabel = document.createElementNS(NS, "text");
        flatLabel.setAttribute("class", "fan-scale-label");
        flatLabel.setAttribute("x", flatPoint.x.toFixed(2));
        flatLabel.setAttribute("y", flatPoint.y.toFixed(2));
        flatLabel.textContent = "♭";
        svg.appendChild(flatLabel);

        const sharpPoint = polar(windowR + 8, halfSpan);
        const sharpLabel = document.createElementNS(NS, "text");
        sharpLabel.setAttribute("class", "fan-scale-label");
        sharpLabel.setAttribute("x", sharpPoint.x.toFixed(2));
        sharpLabel.setAttribute("y", sharpPoint.y.toFixed(2));
        sharpLabel.textContent = "♯";
        svg.appendChild(sharpLabel);

        const hub = document.createElementNS(NS, "circle");
        hub.setAttribute("class", "fan-hub");
        hub.setAttribute("cx", String(cx));
        hub.setAttribute("cy", String(cy));
        hub.setAttribute("r", "4");
        svg.appendChild(hub);

        const label = document.createElementNS(NS, "text");
        label.setAttribute("class", "fan-note-label");
        label.setAttribute("x", String(cx));
        label.setAttribute("y", String(cy - caseR * 0.34));
        label.setAttribute("text-anchor", "middle");
        label.textContent = fan.label;
        svg.appendChild(label);

        container.appendChild(svg);
      });
    }

    buildNeedleIcon();
    buildStrobeIcon("strobeTunerIconWedges");
    buildFanTrio();
  </script>
</body>
