<text x="3" y="55" font-size="1.9">T2–T5 medem ONDE o dedo está (mapa do contato), não só quanto. T3/T4: laranja = linhas TX (cobre de cima), azul = colunas RX (pontes no verso).</text>
<text x="3" y="58" font-size="1.9">T1–T5 sob máscara de solda. T6 com a máscara aberta. Tracejado = serigrafia Ø13.</text>
